name: build

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
    outputs:
      apk-name:
        value: ${{ jobs.build.outputs.apk-name }}
      ver-name:
        value: ${{ jobs.build.outputs.ver-name }}
      ver-code:
        value: ${{ jobs.build.outputs.ver-code }}
      app-ver-code:
        value: ${{ jobs.build.outputs.app-ver-code }}
      build-num:
        value: ${{ jobs.build.outputs.build-num }}
      tag:
        value: ${{ jobs.build.outputs.tag }}
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  push:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  ARTIFACT_NAME: ${{ inputs.artifact-name || format('fagram-build-{0}', github.run_id) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      apk-name: ${{ steps.info.outputs.apk-name }}
      ver-name: ${{ steps.info.outputs.ver-name }}
      ver-code: ${{ steps.info.outputs.ver-code }}
      app-ver-code: ${{ steps.info.outputs.app-ver-code }}
      build-num: ${{ steps.info.outputs.build-num }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.email ci@fagram
          git config --global user.name 'fagram ci'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up ccache
        run: |
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
            | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.fagram-cache" >> $GITHUB_ENV

      - name: Restore ccache
        id: cache-fagram
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: fagram-android-ccache-${{ github.run_id }}
          restore-keys: fagram-android-ccache-

      - name: Set up worktree
        run: pnpm run setup -- --no-stgit

      - name: Compute build info
        id: info
        env:
          FA_BUILD: ${{ vars.FA_BUILD || '1' }}
        run: pnpm tsx scripts/ci/version.ts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Tune Gradle properties
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          android.native.buildOutput=verbose
          EOF

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size 5G
          ccache -z

      - name: Build (unsigned, debug-keyed)
        working-directory: worktree
        env:
          COMMIT_ID: ${{ github.sha }}
          INU_BUILD: ${{ steps.info.outputs.build-num }}
          FA_BUILD: ${{ steps.info.outputs.build-num }}
          INU_BUILD_TYPE: release
          FA_BUILD_TYPE: release
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/worktree
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: ./gradlew --no-daemon :TMessagesProj_App:assembleRelease

      - name: Show ccache stats
        if: always()
        run: ccache -s -v

      - name: Count ccache misses
        id: ccache-stats
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim ccache
        if: github.event_name != 'pull_request' && steps.ccache-stats.outputs.misses != '0'
        run: ccache --evict-older-than 1d

      - name: Save ccache
        if: github.event_name != 'pull_request' && steps.ccache-stats.outputs.misses != '0'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-fagram.outputs.cache-primary-key || format('fagram-android-ccache-{0}', github.run_id) }}

      - name: Stage artifacts
        env:
          LAST_UPLOADED_SHA: ${{ vars.LAST_RELEASE_SHA }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p out
          apk='${{ steps.info.outputs.apk-name }}'
          cp worktree/TMessagesProj_App/build/outputs/apk/release/app.apk "out/$apk"

          base="$LAST_UPLOADED_SHA"
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::last uploaded sha $base not in history, falling back"
            base=
          fi
          if [ -z "$base" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE"
            fi
          fi
          if [ -n "$base" ] && [ "$base" != "$GITHUB_SHA" ]; then
            git log --pretty='%H %s' "$base..$GITHUB_SHA" > out/commits.txt
          else
            git log -1 --pretty='%H %s' "$GITHUB_SHA" > out/commits.txt
          fi

          commits_json=$(jq -R -n '
            [inputs | capture("^(?<sha>[0-9a-f]+) (?<message>.*)$")]
          ' out/commits.txt)
          rm out/commits.txt

          jq -n \
            --arg verName '${{ steps.info.outputs.ver-name }}' \
            --argjson verCode '${{ steps.info.outputs.ver-code }}' \
            --argjson appVerCode '${{ steps.info.outputs.app-ver-code }}' \
            --argjson buildNum '${{ steps.info.outputs.build-num }}' \
            --arg apkFile "$apk" \
            --arg commitSha "$GITHUB_SHA" \
            --argjson commits "$commits_json" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{verName:$verName,verCode:$verCode,appVerCode:$appVerCode,buildNum:$buildNum,apkFile:$apkFile,commitSha:$commitSha,commits:$commits,repo:$repo}' \
            > out/build-info.json

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned
          path: out/*
          if-no-files-found: error
          retention-days: 1
